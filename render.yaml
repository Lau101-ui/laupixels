services:
  - type: web
    name: laupixels-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install --no-audit --no-fund && npx prisma generate
    startCommand: npx prisma migrate deploy && node prisma/seed.js && npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://lau101-ui.github.io
      - key: ASSET_HOSTS
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: laupixels
      POSTGRES_USER: laupixels
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - laupixels-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laupixels -d laupixels"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
  api:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://laupixels:${POSTGRES_PASSWORD}@db:5432/laupixels?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [internal]
volumes:
  laupixels-db:
networks:
  internal:
    driver: bridge
